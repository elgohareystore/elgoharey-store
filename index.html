<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الجوهري | Elgoharey Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            --radius: 16px;
        }

        body.dark {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; transition: background 0.3s, color 0.3s; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding-bottom: 60px; }

        /* الهيدر */
        header { background: var(--bg-card); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
        .logo { font-size: 1.6rem; font-weight: 800; color: var(--primary); text-decoration: none; }
        
        .search-box { flex: 1; max-width: 400px; position: relative; }
        .search-box input { width: 100%; padding: 0.6rem 1rem; border-radius: 30px; border: 1px solid var(--border-color); background: var(--bg-body); color: var(--text-main); outline: none; }

        .nav-actions { display: flex; align-items: center; gap: 1rem; }
        .icon-btn { background: var(--bg-body); border: 1px solid var(--border-color); width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; font-size: 1.2rem; color: var(--text-main); }
        .cart-badge { position: absolute; top: -4px; right: -4px; background: #ef4444; color: white; font-size: 0.75rem; font-weight: bold; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        /* البانر */
        .hero { background: linear-gradient(135deg, #1e293b 0%, #2563eb 100%); color: white; padding: 2.5rem 1.5rem; text-align: center; border-radius: 0 0 24px 24px; margin-bottom: 2rem; }
        .hero h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 0.5rem; }
        .hero p { opacity: 0.9; font-size: 1.1rem; }

        /* شريط الأقسام */
        .categories-bar { display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .cat-btn { padding: 0.6rem 1.4rem; border-radius: 30px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .cat-btn.active, .cat-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* الشبكة */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.8rem; }
        
        .product-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; position: relative; }
        .product-card:hover { transform: translateY(-5px); transition: transform 0.2s ease; }
        .cat-tag { position: absolute; top: 10px; right: 10px; background: rgba(37, 99, 235, 0.9); color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .img-wrap { width: 100%; height: 220px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 10px; border-bottom: 1px solid var(--border-color); }
        .product-card img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        .product-details { padding: 1.2rem; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
        .product-price { font-size: 1.3rem; font-weight: 800; color: var(--primary); margin-bottom: 1rem; }
        .add-to-cart-btn { margin-top: auto; width: 100%; padding: 0.75rem; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .add-to-cart-btn:hover { background: var(--primary-hover); }

        /* السلة الجانبية */
        .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; opacity: 0; transition: opacity 0.3s; }
        .cart-overlay.active { display: block; opacity: 1; }
        
        .cart-drawer { position: fixed; top: 0; left: -450px; width: 100%; max-width: 420px; height: 100%; background: var(--bg-card); z-index: 201; box-shadow: -5px 0 25px rgba(0,0,0,0.15); transition: left 0.3s ease; display: flex; flex-direction: column; }
        .cart-drawer.active { left: 0; }
        
        .cart-header { padding: 1.2rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .cart-header h3 { font-weight: 700; }
        .close-cart { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-main); }
        
        .cart-body { padding: 1.2rem; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
        .cart-item { display: flex; align-items: center; gap: 1rem; background: var(--bg-body); padding: 0.8rem; border-radius: 12px; border: 1px solid var(--border-color); }
        .cart-item img { width: 50px; height: 50px; object-fit: contain; border-radius: 8px; background: white; }
        .cart-item-info { flex: 1; }
        .cart-item-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 0.2rem; }
        .cart-item-price { font-size: 0.9rem; color: var(--primary); font-weight: 700; }
        
        .qty-controls { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.4rem; }
        .qty-btn { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); cursor: pointer; font-weight: bold; }

        /* نموذج بيانات الشحن والعنوان */
        .checkout-section { border-top: 1px solid var(--border-color); padding-top: 1rem; margin-top: 0.5rem; }
        .checkout-section h4 { margin-bottom: 0.8rem; font-size: 1rem; color: var(--primary); }
        .form-control { margin-bottom: 0.7rem; }
        .form-control label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 0.3rem; }
        .form-control input, .form-control select, .form-control textarea { width: 100%; padding: 0.6rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-body); color: var(--text-main); font-size: 0.9rem; outline: none; }

        .cart-footer { padding: 1.2rem; border-top: 1px solid var(--border-color); background: var(--bg-card); }
        .summary-row { display: flex; justify-content: space-between; font-size: 0.95rem; margin-bottom: 0.4rem; color: var(--text-muted); }
        .summary-row.total { font-size: 1.2rem; font-weight: 800; color: var(--text-main); margin-top: 0.5rem; border-top: 1px dashed var(--border-color); padding-top: 0.5rem; }
        .checkout-btn { width: 100%; padding: 0.85rem; background: #25d366; color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 1rem; }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header>
        <div class="nav-container">
            <a href="#" class="logo">Elgoharey Store</a>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن منتج..." oninput="filterProducts()">
            </div>
            <div class="nav-actions">
                <button class="icon-btn" onclick="toggleTheme()" title="الوضع">🌙</button>
                <button class="icon-btn" onclick="toggleCart()" title="السلة">
                    🛒
                    <span class="cart-badge" id="cartBadge">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- البانر -->
    <section class="hero">
        <h1>أحدث المنتجات والعروض الحصرية</h1>
        <p>تسوق أفضل الإلكترونيات والمنتجات بأسعار استثنائية</p>
    </section>

    <!-- الأقسام الرئيسية -->
    <main class="container">
        <div class="categories-bar">
            <button class="cat-btn active" onclick="selectCategory('الكل', this)">الكل 🌐</button>
            <button class="cat-btn" onclick="selectCategory('شاحن', this)">شواحن 🔌</button>
            <button class="cat-btn" onclick="selectCategory('كابل', this)">كابلات ⚡</button>
            <button class="cat-btn" onclick="selectCategory('سماعة', this)">سماعات 🎧</button>
            <button class="cat-btn" onclick="selectCategory('أخرى', this)">أخرى 📦</button>
        </div>

        <div class="products-grid" id="productsGrid">جاري تحميل المنتجات...</div>
    </main>

    <!-- سلة الشراء -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>🛒 سلة الشراء وتأكيد الطلب</h3>
            <button class="close-cart" onclick="toggleCart()">✕</button>
        </div>
        
        <div class="cart-body">
            <div id="cartItemsList">
                <p style="text-align: center; color: var(--text-muted);">السلة فارغة حالياً.</p>
            </div>

            <div class="checkout-section" id="checkoutForm" style="display: none;">
                <h4>📍 بيانات التوصيل والدفع</h4>
                <div class="form-control">
                    <label>الاسم بالكامل *</label>
                    <input type="text" id="custName" placeholder="أدخل اسمك الكريم">
                </div>
                <div class="form-control">
                    <label>رقم الهاتف *</label>
                    <input type="tel" id="custPhone" placeholder="01xxxxxxxxx">
                </div>
                <div class="form-control">
                    <label>المحافظة *</label>
                    <select id="custGov">
                        <option value="">-- اختر المحافظة --</option>
                        <option value="القاهرة">القاهرة</option>
                        <option value="الجيزة">الجيزة</option>
                        <option value="الإسكندرية">الإسكندرية</option>
                        <option value="الدقهلية">الدقهلية</option>
                        <option value="الشرقية">الشرقية</option>
                        <option value="المنوفية">المنوفية</option>
                        <option value="القليوبية">القليوبية</option>
                        <option value="الغربية">الغربية</option>
                        <option value="الفيوم">الفيوم</option>
                        <option value="البحيرة">البحيرة</option>
                        <option value="كفر الشيخ">كفر الشيخ</option>
                        <option value="دمياط">دمياط</option>
                        <option value="بورسعيد">بورسعيد</option>
                        <option value="الإسماعيلية">الإسماعيلية</option>
                        <option value="السويس">السويس</option>
                        <option value="بني سويف">بني سويف</option>
                        <option value="المنيا">المنيا</option>
                        <option value="أسيوط">أسيوط</option>
                        <option value="سوهاج">سوهاج</option>
                        <option value="قنا">قنا</option>
                        <option value="الأقصر">الأقصر</option>
                        <option value="أسوان">أسوان</option>
                        <option value="مطروح">مطروح</option>
                        <option value="البحر الأحمر">البحر الأحمر</option>
                        <option value="الوادي الجديد">الوادي الجديد</option>
                        <option value="شمال سيناء">شمال سيناء</option>
                        <option value="جنوب سيناء">جنوب سيناء</option>
                    </select>
                </div>
                <div class="form-control">
                    <label>العنوان بالتفصيل *</label>
                    <textarea id="custAddress" rows="2" placeholder="المدينة / المركز، اسم الشارع، رقم العمارة"></textarea>
                </div>
            </div>
        </div>

        <div class="cart-footer">
            <div class="summary-row">
                <span>إجمالي المنتجات:</span>
                <span id="subTotal">0 ج.م</span>
            </div>
            <div class="summary-row">
                <span>مصاريف الشحن:</span>
                <span id="shippingFee">150 ج.م</span>
            </div>
            <div class="summary-row total">
                <span>الإجمالي الكلي:</span>
                <span id="grandTotal">0 ج.م</span>
            </div>
            <button class="checkout-btn" onclick="checkoutWhatsApp()">📱 تأكيد الطلب عبر الواتساب</button>
        </div>
    </div>

    <script>
        let products = [];
        let cart = [];
        let currentCategory = 'الكل';
        const SHIPPING_FEE = 150;
        const WHATSAPP_NUMBER = "201000000000"; // استبدله برقمك

        fetch('data.json?t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                products = data;
                renderProducts();
            })
            .catch(() => {
                document.getElementById('productsGrid').innerHTML = '<p>تعذر تحميل المنتجات.</p>';
            });

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            const filtered = products.filter(p => {
                const matchCat = (currentCategory === 'الكل') || (p.category === currentCategory);
                const matchSearch = p.name.toLowerCase().includes(searchVal);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">لا توجد منتجات متوفرة في هذا القسم حالياً.</p>';
                return;
            }

            grid.innerHTML = filtered.map(p => `
                <div class="product-card">
                    <span class="cat-tag">${p.category || 'أخرى'}</span>
                    <div class="img-wrap"><img src="${p.image}" alt="${p.name}"></div>
                    <div class="product-details">
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">${p.price} ج.م</div>
                        <button class="add-to-cart-btn" onclick="addToCart('${p.id}')">🛒 إضافة للسلة</button>
                    </div>
                </div>
            `).join('');
        }

        function selectCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts();
        }

        function filterProducts() {
            renderProducts();
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const exist = cart.find(item => item.id === id);
            if (exist) {
                exist.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCart();
            toggleCart(true);
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                cart = cart.filter(i => i.id !== id);
            }
            updateCart();
        }

        function updateCart() {
            const cartItemsList = document.getElementById('cartItemsList');
            const cartBadge = document.getElementById('cartBadge');
            const subTotalEl = document.getElementById('subTotal');
            const grandTotalEl = document.getElementById('grandTotal');
            const checkoutForm = document.getElementById('checkoutForm');

            const totalQty = cart.reduce((acc, i) => acc + i.qty, 0);
            const subTotal = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
            const grandTotal = subTotal > 0 ? (subTotal + SHIPPING_FEE) : 0;

            cartBadge.innerText = totalQty;
            subTotalEl.innerText = subTotal + ' ج.م';
            grandTotalEl.innerText = grandTotal + ' ج.م';

            if (cart.length === 0) {
                cartItemsList.innerHTML = '<p style="text-align: center; color: var(--text-muted);">السلة فارغة حالياً.</p>';
                checkoutForm.style.display = 'none';
                return;
            }

            checkoutForm.style.display = 'block';
            cartItemsList.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <img src="${item.image}" alt="${item.name}">
                    <div class="cart-item-info">
                        <div class="cart-item-title">${item.name}</div>
                        <div class="cart-item-price">${item.price * item.qty} ج.م</div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="changeQty('${item.id}', -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleCart(forceOpen = false) {
            const overlay = document.getElementById('cartOverlay');
            const drawer = document.getElementById('cartDrawer');
            if (forceOpen) {
                overlay.classList.add('active');
                drawer.classList.add('active');
            } else {
                overlay.classList.toggle('active');
                drawer.classList.toggle('active');
            }
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) return alert('السلة فارغة!');

            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const gov = document.getElementById('custGov').value;
            const address = document.getElementById('custAddress').value.trim();

            if (!name || !phone || !gov || !address) {
                alert('يرجى ملء جميع بيانات التوصيل والعنوان بالكامل قبل تأكيد الطلب!');
                return;
            }

            let message = `🛒 *طلب جديد من Elgoharey Store*\n\n`;
            message += `👤 *الاسم:* ${name}\n`;
            message += `📞 *رقم الهاتف:* ${phone}\n`;
            message += `🏛️ *المحافظة:* ${gov}\n`;
            message += `🏠 *العنوان بالتفصيل:* ${address}\n\n`;
            message += `📦 *تفاصيل المنتجات:*\n`;

            cart.forEach(item => {
                message += `• ${item.name} (القسم: ${item.category || 'أخرى'}) × ${item.qty} = ${item.price * item.qty} ج.م\n`;
            });

            const subTotal = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
            const grandTotal = subTotal + SHIPPING_FEE;

            message += `\n💵 *إجمالي المنتجات:* ${subTotal} ج.م`;
            message += `\n🚚 *مصاريف الشحن:* ${SHIPPING_FEE} ج.م`;
            message += `\n💰 *الإجمالي النهائي:* ${grandTotal} ج.م`;

            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`, '_blank');
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
        }
    </script>
</body>
</html>
