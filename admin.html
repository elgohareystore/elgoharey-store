<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Elgoharey Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: #f8fafc; color: #0f172a; padding: 20px; }
        header { max-width: 1100px; margin: 0 auto 20px auto; background: white; padding: 1.2rem 2rem; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 340px 1fr; gap: 20px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        .card { background: white; border-radius: 12px; padding: 1.5rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-weight: bold; }
        .form-group input { width: 100%; padding: 0.6rem; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
        .btn { padding: 0.6rem 1.2rem; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; text-decoration: none; }
        .btn-primary { background: #2563eb; }
        .btn-success { background: #10b981; width: 100%; }
        .btn-danger { background: #ef4444; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.8rem; border-bottom: 1px solid #e2e8f0; text-align: right; vertical-align: middle; }
        .img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid #cbd5e1; }
        .status-msg { margin-top: 10px; font-weight: bold; font-size: 0.9rem; text-align: center; }
        .upload-box { border: 2px dashed #cbd5e1; padding: 10px; border-radius: 8px; text-align: center; background: #f8fafc; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h2>⚙️ لوحة إدارة المنتجات (ربط تلقائي + رفع صور)</h2>
        <a href="index.html" class="btn btn-primary">🏪 العودة للمتجر</a>
    </header>

    <div class="container">
        <!-- إعدادات GitHub و النموذج -->
        <div class="card">
            <h3>🔑 بيانات الربط مع GitHub</h3>
            <div class="form-group" style="margin-top: 1rem;">
                <label>اسم المستخدم في GitHub:</label>
                <input type="text" id="ghUsername" placeholder="مثال: elgoharey">
            </div>
            <div class="form-group">
                <label>اسم المستودع (Repo):</label>
                <input type="text" id="ghRepo" placeholder="مثال: store">
            </div>
            <div class="form-group">
                <label>رمز الـ Token الشخصي:</label>
                <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxx">
            </div>
            <button class="btn btn-primary" style="width: 100%; margin-bottom: 15px;" onclick="saveConfig()">💾 حفظ البيانات</button>

            <hr style="margin: 15px 0; border: 0; border-top: 1px solid #e2e8f0;">

            <h3>➕ إضافة منتج جديد</h3>
            <form id="addForm" onsubmit="addProduct(event)" style="margin-top: 1rem;">
                <div class="form-group">
                    <label>اسم المنتج:</label>
                    <input type="text" id="prodName" required placeholder="مثال: شاحن سريع">
                </div>
                <div class="form-group">
                    <label>السعر (ج.م):</label>
                    <input type="number" id="prodPrice" required placeholder="مثال: 250">
                </div>
                
                <!-- رفع الصورة من الجهاز -->
                <div class="form-group">
                    <label>اختر صورة من جهازك:</label>
                    <div class="upload-box">
                        <input type="file" id="prodFile" accept="image/*" onchange="previewSelectedFile(event)">
                    </div>
                </div>

                <div class="form-group">
                    <label>أو ضع رابط صورة مباشر:</label>
                    <input type="url" id="prodImage" placeholder="https://domain.com/image.jpg">
                </div>

                <div id="imagePreviewContainer" style="display:none; text-align:center; margin-bottom: 1rem;">
                    <label>معاينة الصورة المختارة:</label><br>
                    <img id="imgPreview" class="img-preview" style="width: 80px; height: 80px; margin-top: 5px;" src="">
                </div>

                <button type="submit" class="btn btn-success" id="saveBtn">🚀 حفظ ونشر على GitHub</button>
            </form>
            <div id="statusMsg" class="status-msg"></div>
        </div>

        <!-- جدول القائمة -->
        <div class="card">
            <h3>📦 قائمة المنتجات الحالية</h3>
            <table>
                <thead>
                    <tr>
                        <th>الصورة</th>
                        <th>الاسم</th>
                        <th>السعر</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="4">جاري جلب المنتجات...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let products = [];
        let base64Image = "";

        window.onload = function() {
            if (localStorage.getItem('gh_user')) document.getElementById('ghUsername').value = localStorage.getItem('gh_user');
            if (localStorage.getItem('gh_repo')) document.getElementById('ghRepo').value = localStorage.getItem('gh_repo');
            if (localStorage.getItem('gh_token')) document.getElementById('ghToken').value = localStorage.getItem('gh_token');
            loadProductsFromJSON();
        };

        function saveConfig() {
            localStorage.setItem('gh_user', document.getElementById('ghUsername').value.trim());
            localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim());
            localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
            alert('تم حفظ بيانات الربط بنجاح في متصفحك!');
        }

        function loadProductsFromJSON() {
            fetch('data.json?t=' + Date.now())
                .then(res => res.json())
                .then(data => { products = data; renderTable(); })
                .catch(() => { products = []; renderTable(); });
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4">لا توجد منتجات.</td></tr>';
                return;
            }
            tbody.innerHTML = products.map((p, index) => `
                <tr>
                    <td><img src="${p.image}" class="img-preview" alt="${p.name}"></td>
                    <td>${p.name}</td>
                    <td>${p.price} ج.م</td>
                    <td><button class="btn btn-danger" onclick="deleteProduct(${index})">حذف ونشر</button></td>
                </tr>
            `).join('');
        }

        // تحويل صورة الجهاز إلى Base64 ومعاينتها
        function previewSelectedFile(event) {
            const file = event.target.files[0];
            if (file) {
                // تظبيط الحجم كي لا يتجاوز 1 ميجابايت لسرعة الأداء
                if (file.size > 1024 * 1024) {
                    alert('⚠️ يفضل اختيار صورة حجمها أقل من 1 ميجابايت لضمان سرعة التحميل.');
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64Image = e.target.result;
                    document.getElementById('imgPreview').src = base64Image;
                    document.getElementById('imagePreviewContainer').style.display = 'block';
                    document.getElementById('prodImage').value = ''; // تفريغ الرابط عند اختيار ملف
                };
                reader.readAsDataURL(file);
            }
        }

        // إضافة منتج جديد
        async function addProduct(e) {
            e.preventDefault();
            const name = document.getElementById('prodName').value;
            const price = Number(document.getElementById('prodPrice').value);
            const urlImage = document.getElementById('prodImage').value.trim();
            
            // تحديد مصدر الصورة (الملف من الجهاز أو الرابط)
            const finalImage = base64Image || urlImage;

            if (!finalImage) {
                alert('يرجى اختيار صورة من الجهاز أو أدخل رابط صورة!');
                return;
            }

            products.push({ id: Date.now().toString(), name, price, image: finalImage });
            
            const success = await syncWithGitHub();
            if (success) {
                document.getElementById('addForm').reset();
                document.getElementById('imagePreviewContainer').style.display = 'none';
                base64Image = "";
                renderTable();
            }
        }

        async function deleteProduct(index) {
            if (confirm('هل أنت تأكد من حذف هذا المنتج؟')) {
                products.splice(index, 1);
                const success = await syncWithGitHub();
                if (success) renderTable();
            }
        }

        async function syncWithGitHub() {
            const username = document.getElementById('ghUsername').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();
            const token = document.getElementById('ghToken').value.trim();
            const status = document.getElementById('statusMsg');

            if (!username || !repo || !token) {
                alert('يرجى ملء بيانات GitHub والرمز (Token) أولاً وتحديد حفظ!');
                return false;
            }

            status.style.color = "#2563eb";
            status.innerText = "⏳ جاري رفع الصورة وتحديث GitHub...";

            try {
                const getUrl = `https://api.github.com/repos/${username}/${repo}/contents/data.json`;
                const getRes = await fetch(getUrl, {
                    headers: { 'Authorization': `token ${token}` }
                });
                
                let sha = "";
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }

                const jsonContent = JSON.stringify(products, null, 2);
                const encodedContent = btoa(unescape(encodeURIComponent(jsonContent)));

                const putRes = await fetch(getUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'تحديث المنتجات والصور تلقائياً عبر لوحة التحكم',
                        content: encodedContent,
                        sha: sha ? sha : undefined
                    })
                });

                if (putRes.ok) {
                    status.style.color = "#10b981";
                    status.innerText = "✅ تم النشر وتحديث المنتجات والصور بنجاح!";
                    return true;
                } else {
                    const err = await putRes.json();
                    throw new Error(err.message || 'فشل الاتصال');
                }
            } catch (err) {
                status.style.color = "#ef4444";
                status.innerText = "❌ خطأ: " + err.message;
                return false;
            }
        }
    </script>
</body>
</html>
